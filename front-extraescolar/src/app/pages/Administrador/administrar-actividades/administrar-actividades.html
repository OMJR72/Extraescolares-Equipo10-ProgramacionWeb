<div class="layout">
  <!-- ================= BARRA LATERAL ================= -->
  <aside class="sidebar">
    <div class="sidebar__marca">
      <img class="sidebar__logo" src="logo.png" alt="Logotipo ITO" />
      <span class="sidebar__nombre">Complementarias</span>
    </div>

    <nav class="sidebar__nav" aria-label="Menú principal">
      <p class="sidebar__titulo">Menu Principal</p>

      <a class="sidebar__enlace" href="/administrar-usuario">
        <svg class="sidebar__icono" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="7" cy="9" r="3" fill="currentColor" />
          <path d="M2 18c0-3 2.5-5 5-5s5 2 5 5z" fill="currentColor" />
          <path d="M14 8h8M14 12h8M16 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>Administrar Usuario</span>
      </a>

      <a class="sidebar__enlace sidebar__enlace--activo" href="/administrar-actividades" aria-current="page">
        <svg class="sidebar__icono" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 1 9l11 6 9-4.9V16h2V9z" fill="currentColor" />
          <path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8z" fill="currentColor" />
        </svg>
        <span>Administrar Actividades</span>
      </a>

      <hr class="sidebar__separador" />
    </nav>

    <button type="button" class="sidebar__salir" (click)="cerrarSesion()">
      <span>Cerrar sesión</span>
      <svg class="sidebar__salir-icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M3 12h12M10 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </aside>

  <!-- ================= CONTENIDO ================= -->
  <main class="contenido">
    <h1 class="contenido__titulo">Actividades</h1>

    <ul class="tarjetas">
      @for (categoria of categorias; track categoria.id) {
        <li class="tarjetas__item">
          <button type="button" class="tarjeta" (click)="seleccionarCategoria(categoria)">
            <img class="tarjeta__imagen" [src]="categoria.imagen" [alt]="categoria.descripcionImagen" />
            <span class="tarjeta__titulo">{{ categoria.titulo }}</span>
          </button>
        </li>
      }
    </ul>
  </main>
</div>
