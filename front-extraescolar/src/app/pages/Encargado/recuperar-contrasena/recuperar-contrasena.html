<main class="pantalla">
  <img class="logo" src="logo.png" alt="Logo del Instituto Tecnológico de Oaxaca (ITO)" />

  <section class="tarjeta" aria-labelledby="titulo-principal">
    <header class="encabezado">
      <h1 id="titulo-principal" class="titulo">Recuperación de contraseña</h1>
    </header>

    <form class="formulario" [formGroup]="formulario" (ngSubmit)="onSubmit()" novalidate>
      <div class="campo">
        <label class="campo__etiqueta" for="clave">Clave de recuperacion:</label>
        <input
          class="campo__entrada"
          id="clave"
          type="text"
          inputmode="numeric"
          formControlName="clave"
          placeholder="ej. 32468912"
          autocomplete="one-time-code"
        />
      </div>

      <div class="aviso" role="status">
        <svg class="aviso__icono" viewBox="0 0 50 50" aria-hidden="true" focusable="false">
          <path
            d="M25 2C12.3 2 2 11 2 22.5c0 5.4 2.3 10.3 6 14-.2 3.4-1.6 7-3.6 9.3-.5.6-.1 1.6.7 1.5 5.3-.6 9.4-2.6 12-4.7 2.5.8 5.2 1.2 8 1.2 12.7 0 23-9 23-20.5S37.700 2 25 2Z"
            fill="#cccccc"
            stroke="#000000"
            stroke-width="1.5"
          />
          <rect x="23.500" y="11" width="3" height="14" rx="1.500" fill="#000000" />
          <circle cx="25" cy="31" r="2" fill="#000000" />
        </svg>
        <p class="aviso__texto">
          Se envio una clave de recuperación a tu correo institucional. Por favor verifica tu
          bandeja de entrada.
        </p>
      </div>

      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }

      <div class="acciones">
        <button class="boton boton--aceptar" type="submit" [disabled]="cargando">
          {{ cargando ? 'Verificando...' : 'Aceptar' }}
        </button>
        <button class="boton boton--volver" type="button" (click)="volver()">Volver</button>
      </div>
    </form>
  </section>
</main>
