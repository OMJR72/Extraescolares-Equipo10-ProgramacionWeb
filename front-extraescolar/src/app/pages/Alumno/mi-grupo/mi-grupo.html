<section class="page">

  <header class="page-header">
    <h1>Mi grupo</h1>
    <p>Información de la actividad complementaria en la que estás inscrito.</p>
  </header>

  <div class="grupo-card">
    <div class="activity-banner">
      <span class="badge">Actividad inscrita</span>
      <h2>{{ grupo.actividad }}</h2>
    </div>

    <dl class="detalles">
      <div>
        <dt>Encargado</dt>
        <dd>{{ grupo.encargado }}</dd>
      </div>
      <div>
        <dt>Grupo</dt>
        <dd>{{ grupo.grupo }}</dd>
      </div>
      <div>
        <dt>Aula</dt>
        <dd>{{ grupo.aula }}</dd>
      </div>
      <div>
        <dt>Horario</dt>
        <dd>{{ grupo.horario }}</dd>
      </div>
      <div>
        <dt>Cupo</dt>
        <dd>{{ grupo.cupo }}</dd>
      </div>
    </dl>

    <div class="acciones">
      <button type="button" class="download-button" (click)="descargarHorario()">
        Descargar horario en PDF
      </button>
      <p *ngIf="mensaje" class="mensaje">{{ mensaje }}</p>
    </div>
  </div>

</section>
